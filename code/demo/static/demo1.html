<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시연 ① 데이터 → 추론 → write-back</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>시연 ① 데이터 → 추론 → write-back</h1>
        <p>그래프에서 파라미터를 읽고, 위험도를 계산해, 다시 그래프에 저장합니다</p>
      </div>
    </a>
    <div class="topbar-meta">
      <a class="back-link" href="/">← 시연 목록</a>
    </div>
  </header>

  <main class="demo1-main">
    <!-- 좌측: 동네 선택 + attribute -->
    <aside class="segment-panel" aria-label="동네 선택">
      <h2>① 동네를 골라주세요</h2>
      <p class="segment-panel-hint">★은 본방 시연 추천. 5건 모두 9단계 실행 가능.</p>
      <div class="segment-list" id="segment-list" role="radiogroup">
        <!-- JS 로 렌더 -->
      </div>
      <div class="segment-attrs" id="segment-attrs" hidden>
        <h3>이 동네 입력값</h3>
        <div id="attr-rows"></div>
      </div>
    </aside>

    <!-- 우측: 9단계 진행 -->
    <section class="steps-panel">
      <!-- 진행 비드 -->
      <div class="progress" aria-label="진행">
        <div class="progress-track" id="progress-track">
          <!-- bead × 9 -->
        </div>
        <span class="progress-label" id="progress-label">동네 선택 대기 중</span>
      </div>

      <!-- 단계 카드 컨테이너 -->
      <div id="steps-container">
        <!-- JS 로 렌더 -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>재난 온톨로지 스터디 — 산불 PoC · 5주차 스터디</span>
    <span id="footer-meta">v0.2 · prd-demo1 v2.1</span>
  </footer>

  <script src="/static/demo1.js" defer></script>
</body>
</html>
