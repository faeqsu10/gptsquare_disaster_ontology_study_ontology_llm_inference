[project]
name = "wildfire-study-poc"
version = "0.1.0"
description = "재난 온톨로지 스터디 — 온톨로지와 LLM 연동 추론 (5주차 발표 ③) 학습용 PoC"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # core
    "typedb-driver>=3.10.0",
    "google-genai>=1.74.0",
    "python-dotenv>=1.2.2",
    # ML
    "lightgbm>=4.6.0",
    "scikit-learn>=1.8.0",
    "numpy>=2.4.4",
    # demo web UI
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 골든 TypeQL 패턴 표는 한 줄로 적어야 명확
"code/llm/text_to_typeql.py" = ["E501"]
# UI 라벨 dict 안 한국어 한 줄 문장
"code/demo/server.py" = ["E501"]

# 회귀 테스트들은 pytest 함수 형식이 아니라 standalone 스크립트(def main + if __name__)이므로
# ./code/run.sh code/tests/test_xxx.py 형태로 직접 실행합니다.
